# Local development: only the stateful services. Run the apps with `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kontext
      POSTGRES_PASSWORD: kontext
      POSTGRES_DB: kontext
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kontext -d kontext']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
