# Kontext Quiz — single-server deployment, one hostname, no build step.
#
# Everything is pulled from the GitHub Container Registry (built by CI):
#   ghcr.io/kilomebit17/kontext-quiz/web     — the site (nginx + static files)
#   ghcr.io/kilomebit17/kontext-quiz/server  — API + WebSocket (Node)
# plus PostgreSQL, Redis and Caddy (reverse proxy with automatic HTTPS).
#
# Files needed on the server, in one folder:
#   docker-compose.yml   (this file)
#   .env                 (see .env.example next to it)
#
# Start / update / stop:
#   docker compose up -d            # first start (pulls images, applies DB migrations)
#   docker compose pull && docker compose up -d   # update to the latest images
#   docker compose logs -f server   # server logs
#   docker compose down             # stop (data volumes are kept)
#
# Requires Docker Engine with Compose v2.23.1 or newer (for `configs.content`).

name: kontext-quiz

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env, e.g. 1.2.3.4.sslip.io}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - server

  web:
    image: ghcr.io/kilomebit17/kontext-quiz/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - '80'

  server:
    image: ghcr.io/kilomebit17/kontext-quiz/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      # The site and the API share one hostname; Caddy routes /api and /socket.io to the server.
      WEB_ORIGIN: https://${SITE_ADDRESS}
      API_ORIGIN: https://${SITE_ADDRESS}
      DATABASE_URL: postgres://kontext:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/kontext
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      COOKIE_SECRET: ${COOKIE_SECRET:?Set COOKIE_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JOIN_RATE_LIMIT_PER_MIN: ${JOIN_RATE_LIMIT_PER_MIN:-300}
      PIN_GUESS_LIMIT_PER_MIN: ${PIN_GUESS_LIMIT_PER_MIN:-10}
    expose:
      - '4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Apply database migrations, then start.
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/index.js']

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kontext
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kontext
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kontext -d kontext']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

configs:
  caddyfile:
    content: |
      # Compose fills in the hostname from .env before Caddy reads this.
      ${SITE_ADDRESS} {
        encode zstd gzip

        # API, WebSocket and health check go to the Node server …
        @backend path /api/* /socket.io/* /healthz
        reverse_proxy @backend server:4000 {
          flush_interval -1
        }

        # … everything else is the static site.
        reverse_proxy web:80

        header {
          Strict-Transport-Security "max-age=31536000; includeSubDomains"
          X-Content-Type-Options "nosniff"
          Referrer-Policy "strict-origin-when-cross-origin"
        }
      }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
