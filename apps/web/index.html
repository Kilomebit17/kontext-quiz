<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141B33" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Kontext Quiz — вікторина в реальному часі для класу, команди чи вечірки. Створи вікторину, покажи PIN, і гравці приєднуються з телефонів."
    />
    <meta name="application-name" content="Kontext Quiz" />
    <meta name="robots" content="index, follow" />
    <!-- %VITE_SITE_URL% is filled in by Vite from .env.production (or the VITE_SITE_URL build variable). -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- Open Graph (Telegram, Viber, Facebook, LinkedIn …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kontext Quiz" />
    <meta property="og:title" content="Kontext Quiz — вікторина в реальному часі" />
    <meta
      property="og:description"
      content="Створи вікторину, покажи PIN або QR-код, і гравці приєднуються з телефонів. Для класу, команди чи вечірки."
    />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kontext Quiz — вікторина в реальному часі" />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kontext Quiz — вікторина в реальному часі" />
    <meta
      name="twitter:description"
      content="Створи вікторину, покажи PIN або QR-код, і гравці приєднуються з телефонів."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kontext" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- Fonts are self-hosted and declared in CSS with font-display: swap; they are deliberately not
         preloaded so they never compete with the app bundle for bandwidth on slow connections. -->
    <title>Kontext Quiz</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Kontext Quiz",
        "url": "%VITE_SITE_URL%/",
        "description": "Вікторина в реальному часі для класу, команди чи вечірки: ведучий показує PIN, гравці приєднуються з телефонів.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": ["uk", "en"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "UAH" },
        "image": "%VITE_SITE_URL%/og.png"
      }
    </script>
  </head>
  <body>
    <noscript>
      <div
        style="
          padding: 2rem;
          font-family: system-ui;
          color: #f4f6ff;
          background: #141b33;
          min-height: 100vh;
        "
      >
        <h1>Kontext Quiz</h1>
        <p>Для гри потрібен JavaScript. / JavaScript is required to play.</p>
      </div>
    </noscript>
    <div id="root">
      <!-- App-shell splash: painted before any JavaScript arrives, replaced by React on mount. -->
      <div
        aria-hidden="true"
        style="
          display: flex;
          min-height: 100dvh;
          align-items: center;
          justify-content: center;
          background: #141b33;
          color: #f4f6ff;
          font:
            800 1.75rem/1 system-ui,
            sans-serif;
          letter-spacing: -0.02em;
        "
      >
        Kontext&nbsp;<span style="color: #ff6b6b; font-weight: 500">Quiz</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
