name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  check:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kontext/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          STORE: memory
          JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
          COOKIE_SECRET: ci-cookie-secret-ci-cookie-secret-ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  load:
    name: WebSocket load (200 players)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start server (memory mode)
        run: |
          STORE=memory PORT=4000 JWT_SECRET=ci-jwt-secret-ci-jwt-secret-ci-jwt-secret COOKIE_SECRET=ci-cookie-secret-ci-cookie-secret-ci \
            pnpm --filter @kontext/server dev > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/healthz && break; sleep 1; done
      - run: PLAYERS=200 API_URL=http://localhost:4000 pnpm test:load
      - name: Server log
        if: always()
        run: tail -n 100 server.log

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Image names must be lowercase; github.repository keeps the owner's casing.
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ steps.repo.outputs.name }}/server:${{ github.sha }},ghcr.io/${{ steps.repo.outputs.name }}/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VITE_API_URL=${{ vars.API_ORIGIN }}
          tags: ghcr.io/${{ steps.repo.outputs.name }}/web:${{ github.sha }},ghcr.io/${{ steps.repo.outputs.name }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (Fly.io)
    runs-on: ubuntu-latest
    needs: [e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_TARGET == 'fly'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config deploy/fly.server.toml --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --config deploy/fly.web.toml --remote-only --build-arg VITE_API_URL=${{ vars.API_ORIGIN }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
